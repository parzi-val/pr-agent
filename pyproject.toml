[tool.poetry]
name = "pr-agent"
version = "0.1.0"
description = "Automated PR Review Agent"
authors = ["Antigravity"]
packages = [{include = "pr_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
langchain = "^0.1.0"
langchain-google-genai = "^0.0.6"
langgraph = "^0.0.10"
httpx = "^0.26.0"
PyGithub = "^2.1.1"
gitingest = "^0.1.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
